name: Publicar imagem do Miner

on:
  push:
    branches: [main]
    paths:
      - "miner-backend/**"
      - "miner-front/**"
      - ".dockerignore"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: miner-backend/Dockerfile
          push: true
          tags: ghcr.io/blarissa/miner:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
